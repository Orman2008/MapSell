<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <title>MapSell</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <link
    rel="stylesheet"
    href="css/style.css"
  >
</head>

<body>

<header class="topbar">

  <div class="brand">
    🗺️ MapSell
  </div>

  <nav>
    <a class="active" href="index.html">
      Карта
    </a>

    <a href="notes.html">
      Заметки
    </a>
  </nav>

</header>


<main class="app">

  <!-- ==============================
       SEARCH
  =============================== -->

  <section class="controls">

    <div class="search-row">

      <input
        id="search"
        type="text"
        autocomplete="off"
        placeholder="shop, aptek, dental, butik..."
      >

      <button id="searchBtn">
        🔍
      </button>

    </div>


    <div class="quick-buttons">

      <button
        id="locationBtn"
        class="secondary"
      >
        📍 Моё место
      </button>

      <button
        id="allBtn"
        class="secondary"
      >
        ⭐ Мои места
      </button>

    </div>


    <div id="status" class="status"></div>

  </section>


  <!-- ==============================
       SEARCH RESULTS
  =============================== -->

  <aside
    id="resultsPanel"
    class="results-panel hidden"
  >

    <div class="results-header">

      <b id="resultsTitle">
        Результаты
      </b>

      <button id="closeResults">
        ×
      </button>

    </div>


    <div id="resultsList"></div>

  </aside>


  <!-- ==============================
       MAP
  =============================== -->

  <div id="map"></div>


  <!-- ==============================
       ROUTE PANEL
  =============================== -->

  <div
    id="routePanel"
    class="route-panel hidden"
  >

    <div class="route-header">

      <div>
        <b id="routeTitle">
          🧭 Маршрут
        </b>
      </div>

      <button id="closeRoute">
        ×
      </button>

    </div>


    <div class="route-options">

      <div class="route-option">

        <div class="route-icon">
          🚶
        </div>

        <div>
          <b>Пешком</b>

          <div>
            <span id="walkDistance">
              —
            </span>

            ·

            <span id="walkTime">
              —
            </span>
          </div>
        </div>

      </div>


      <div class="route-option">

        <div class="route-icon">
          🚗
        </div>

        <div>
          <b>На машине</b>

          <div>
            <span id="carDistance">
              —
            </span>

            ·

            <span id="carTime">
              —
            </span>
          </div>
        </div>

      </div>

    </div>

  </div>


</main>


<!-- ==============================
     PLACE MODAL
=============================== -->

<div
  id="modal"
  class="modal hidden"
>

  <div class="modal-card">

    <button
      id="closeModal"
      class="close"
    >
      ×
    </button>


    <h2 id="modalTitle">
      Место
    </h2>


    <p
      id="modalAddress"
      class="modal-address"
    ></p>


    <!-- STATUS -->

    <div class="sale-section">

      <p>
        Статус продажи:
      </p>


      <div class="sale-buttons">

        <button
          id="soldYes"
          class="sold-yes"
        >
          + Продал
        </button>


        <button
          id="soldNo"
          class="sold-no"
        >
          − Не продал
        </button>

      </div>

    </div>


    <!-- NOTE -->

    <div class="note-section">

      <p>
        📝 Заметка
      </p>

      <textarea
        id="note"
        maxlength="2000"
        placeholder="Напиши заметку об этом месте..."
      ></textarea>


      <button id="saveNote">
        💾 Сохранить заметку
      </button>

    </div>


    <!-- ROUTE -->

    <button
      id="routeBtn"
      class="route-button"
    >
      🧭 Построить маршрут
    </button>

  </div>

</div>


<!-- ==============================
     SCRIPTS
=============================== -->

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="js/config.js"></script>

<script src="js/app.js"></script>

</body>

</html>
