<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <title>MapSell</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="topbar">

  <div class="brand">
    🗺️ MapSell
  </div>

  <nav>
    <a class="active" href="index.html">Карта</a>
    <a href="notes.html">Заметки</a>
  </nav>

</header>


<main class="app">

  <!-- SEARCH -->

  <section class="controls">

    <div class="search-row">

      <input
        id="search"
        type="text"
        autocomplete="off"
        placeholder="shop, aptek, dental, butik..."
      >

      <button id="searchBtn">
        🔍
      </button>

    </div>


    <div class="quick-buttons">

      <button id="locationBtn">
        📍 Моё место
      </button>

      <button id="allBtn">
        ⭐ Мои места
      </button>

    </div>

    <div id="status" class="status"></div>

  </section>


  <!-- RESULTS -->

  <aside
    id="resultsPanel"
    class="results-panel hidden"
  >

    <div class="results-header">

      <b id="resultsTitle">
        Результаты
      </b>

      <button id="closeResults">
        ×
      </button>

    </div>

    <div id="resultsList"></div>

  </aside>


  <!-- MAP -->

  <div id="map"></div>


  <!-- ROUTE PANEL -->

  <div
    id="routePanel"
    class="route-panel hidden"
  >

    <div class="route-header">

      <b>🧭 Маршрут</b>

      <button id="closeRoute">
        ×
      </button>

    </div>


    <div class="route-place" id="routePlace">
      Выберите место
    </div>


    <div class="route-options">

      <button
        id="walkRoute"
        class="route-option"
      >

        <div class="route-icon">
          🚶
        </div>

        <div class="route-name">
          Пешком
        </div>

        <div
          id="walkInfo"
          class="route-info"
        >
          Расчёт...
        </div>

      </button>


      <button
        id="carRoute"
        class="route-option active"
      >

        <div class="route-icon">
          🚗
        </div>

        <div class="route-name">
          На машине
        </div>

        <div
          id="carInfo"
          class="route-info"
        >
          Расчёт...
        </div>

      </button>

    </div>


    <button
      id="openNavigation"
      class="navigation-button"
    >
      🧭 Начать навигацию
    </button>

  </div>

</main>


<!-- PLACE MODAL -->

<div
  id="placeModal"
  class="modal hidden"
>

  <div class="place-card">

    <button
      id="closePlace"
      class="close"
    >
      ×
    </button>

    <div id="placeContent"></div>

  </div>

</div>


<!-- NOTE MODAL -->

<div
  id="noteModal"
  class="modal hidden"
>

  <div class="modal-card">

    <button
      id="closeNote"
      class="close"
    >
      ×
    </button>

    <h2>
      📝 Заметка
    </h2>

    <textarea
      id="note"
      maxlength="2000"
      placeholder="Напиши заметку об этом месте..."
    ></textarea>

    <button id="saveNote">
      💾 Сохранить заметку
    </button>

  </div>

</div>


<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script src="https://api-maps.yandex.ru/2.1/?apikey=301fa25b-27ad-466b-b7bf-53d28d2422d4&lang=ru_RU"></script><script src="js/config.js"></script>

<script>
  const yandexScript = document.currentScript.previousElementSibling;
</script>

<script src="js/app.js"></script>

</body>
</html>
